<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main>
    <div class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex justify-center">
            <div class="w-full max-w-lg">
                <h2 class="mb-6 text-2xl font-bold text-gray-800">
                    <span th:text="${category.id != null} ? 'Edit Kategori' : 'Tambah Kategori Baru'">Form Kategori</span>
                </h2>

                <div class="bg-white rounded-lg shadow p-6">
                    <!-- Error Message -->
                    <div th:if="${errorMessage}" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded">
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/categories/save}" th:object="${category}" method="post">
                        <!-- Hidden ID -->
                        <input type="hidden" th:field="*{id}">

                        <!-- Category Name -->
                        <div class="mb-4">
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Nama Kategori</label>
                            <input type="text" 
                                   class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" 
                                   id="name" 
                                   th:field="*{name}" 
                                   placeholder="Contoh: Elektronik, Buku, dll" 
                                   required>
                        </div>

                        <!-- Description -->
                        <div class="mb-4">
                            <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Deskripsi (Opsional)</label>
                            <textarea class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" 
                                      id="description" 
                                      th:field="*{description}" 
                                      rows="4" 
                                      placeholder="Deskripsi singkat tentang kategori ini"></textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="flex gap-2">
                            <button type="submit" 
                                    class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-6 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                                <span th:text="${category.id != null} ? 'Update' : 'Simpan'">Simpan</span>
                            </button>
                            <a href="/categories" class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-6 rounded focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors">
                                Batal
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
