<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: header}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main>
    <div class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Daftar Kategori</h2>
            <a href="/categories/new" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded transition-colors">
                + Tambah Kategori
            </a>
        </div>

        <!-- Flash Messages -->
        <div th:if="${successMessage}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" role="alert">
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" role="alert">
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Category Table -->
        <div th:if="${#lists.size(categories) > 0}" class="bg-white shadow rounded overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="px-4 py-3 text-left">No</th>
                        <th class="px-4 py-3 text-left">Nama</th>
                        <th class="px-4 py-3 text-left">Deskripsi</th>
                        <th class="px-4 py-3 text-left">Tanggal Dibuat</th>
                        <th class="px-4 py-3 text-left">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cat, iterStat : ${categories}" class="hover:bg-gray-50 border-b border-gray-200">
                        <td class="px-4 py-3" th:text="${iterStat.index + 1}">1</td>
                        <td class="px-4 py-3 font-medium text-gray-800" th:text="${cat.name}">Category Name</td>
                        <td class="px-4 py-3 text-gray-600" th:text="${cat.description != null ? cat.description : '-'}">-</td>
                        <td class="px-4 py-3 text-gray-600" th:text="${cat.createdAt}">2026-01-01</td>
                        <td class="px-4 py-3">
                            <a th:href="@{/categories/{id}/edit(id=${cat.id})}" class="text-blue-500 hover:text-blue-700 mr-3">Edit</a>
                            <form th:action="@{/categories/{id}/delete(id=${cat.id})}" method="post" style="display:inline;" 
                                  onsubmit="return confirm('Hapus kategori ini? Products dengan kategori ini tidak akan terpengaruh.');">
                                <button type="submit" class="text-red-500 hover:text-red-700">Hapus</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.size(categories) == 0}" class="text-center py-10">
            <p class="text-gray-500 text-lg">Belum ada kategori. Buat kategori pertama Anda!</p>
            <a href="/categories/new" class="inline-block mt-4 bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-6 rounded transition-colors">
                Tambah Kategori
            </a>
        </div>
    </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
