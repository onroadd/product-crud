<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: header}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Daftar Produk</h2>
            <a th:href="@{/products/new}" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded transition-colors">
                + Tambah Produk Baru
            </a>
        </div>

        <!-- Flash Messages -->
        <div th:if="${successMessage}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" role="alert">
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" role="alert">
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- User Info -->
        <div class="mb-3 text-gray-600">
            <small>Login sebagai: <strong sec:authentication="name" class="text-blue-600"></strong></small>
        </div>

        <!-- Product Count -->
        <p class="text-gray-600">
            Total produk: <strong th:text="${#lists.size(products)}">0</strong>
        </p>

        <!-- Product Table -->
        <div th:if="${!#lists.isEmpty(products)}" class="overflow-x-auto">
            <table class="w-full border-collapse border border-gray-300 min-w-[800px]">
                <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="border border-gray-300 px-4 py-2 text-left">No</th>
                        <th class="border border-gray-300 px-4 py-2 text-left">Nama</th>
                        <th class="border border-gray-300 px-4 py-2 text-left">Kategori</th>
                        <th class="border border-gray-300 px-4 py-2 text-left">Harga</th>
                        <th class="border border-gray-300 px-4 py-2 text-left">Stok</th>
                        <th class="border border-gray-300 px-4 py-2 text-left">Status</th>
                        <th class="border border-gray-300 px-4 py-2 text-left">Creator</th>
                        <th class="border border-gray-300 px-4 py-2 text-left">Updater</th>
                        <th class="border border-gray-300 px-4 py-2 text-left">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product, iterStat : ${products}" class="hover:bg-gray-50">
                        <td class="border border-gray-300 px-4 py-2" th:text="${iterStat.index + 1}">1</td>
                        <td class="border border-gray-300 px-4 py-2" th:text="${product.name}">Nama Produk</td>
                        <td class="border border-gray-300 px-4 py-2" th:text="${product.category?.name}">Kategori</td>
                        <td class="border border-gray-300 px-4 py-2" th:text="${'Rp ' + #numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA')}">Rp 0</td>
                        <td class="border border-gray-300 px-4 py-2" th:text="${product.stock}">0</td>
                        <td class="border border-gray-300 px-4 py-2">
                            <span th:if="${product.active}" class="bg-green-500 text-white px-2 py-1 rounded text-xs">Aktif</span>
                            <span th:unless="${product.active}" class="bg-red-500 text-white px-2 py-1 rounded text-xs">Tidak Aktif</span>
                        </td>
                        <td class="border border-gray-300 px-4 py-2" th:text="${product.createdBy ?: '-'}">-</td>
                        <td class="border border-gray-300 px-4 py-2" th:text="${product.updatedBy ?: '-'}">-</td>
                        <td class="border border-gray-300 px-4 py-2">
                            <a th:href="@{/products/{id}(id=${product.id})}" class="text-blue-500 hover:text-blue-700 mr-2">Detail</a>
                            <a th:href="@{/products/{id}/edit(id=${product.id})}" class="text-yellow-600 hover:text-yellow-800 mr-2">Edit</a>
                            <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post" style="display:inline;"
                                  onsubmit="return confirm('Apakah Anda yakin ingin menghapus produk ini?');">
                                <button type="submit" class="text-red-500 hover:text-red-700">Hapus</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(products)}" class="text-center py-10">
            <p class="text-gray-500 text-lg">Belum ada produk.</p>
            <a th:href="@{/products/new}" class="inline-block mt-4 bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-6 rounded transition-colors">
                Tambah Produk Pertama
            </a>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
