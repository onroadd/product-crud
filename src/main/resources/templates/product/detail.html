<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main>
    <div class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex justify-center">
            <div class="w-full max-w-2xl">
                <h2 th:text="${product.name}" class="mb-6 text-2xl font-bold text-gray-800">Nama Produk</h2>

                <div class="bg-white shadow rounded">
                    <div class="p-4">
                        <table class="w-full">
                            <tr>
                                <th class="text-gray-600 py-2 text-left" style="width: 200px;">Nama</th>
                                <td class="py-2" th:text="${product.name}">-</td>
                            </tr>
                            <tr>
                                <th class="text-gray-600 py-2 text-left">Kategori</th>
                                <td class="py-2" th:text="${product.category?.displayName}">-</td>
                            </tr>
                            <tr>
                                <th class="text-gray-600 py-2 text-left">Harga</th>
                                <td class="py-2" th:text="${'Rp ' + #numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA')}">Rp 0</td>
                            </tr>
                            <tr>
                                <th class="text-gray-600 py-2 text-left">Stok</th>
                                <td class="py-2" th:text="${product.stock}">0</td>
                            </tr>
                            <tr>
                                <th class="text-gray-600 py-2 text-left">Deskripsi</th>
                                <td class="py-2" th:text="${product.description}">-</td>
                            </tr>
                            <tr>
                                <th class="text-gray-600 py-2 text-left">Status</th>
                                <td class="py-2">
                                    <span th:if="${product.active}" class="bg-green-500 text-white px-2 py-1 rounded text-xs">Aktif</span>
                                    <span th:unless="${product.active}" class="bg-red-500 text-white px-2 py-1 rounded text-xs">Tidak Aktif</span>
                                </td>
                            </tr>
                            <tr>
                                <th class="text-gray-600 py-2 text-left">Tanggal Dibuat</th>
                                <td class="py-2" th:text="${product.createdAt}">-</td>
                            </tr>
                        </table>
                    </div>
                </div>

                <div class="flex gap-2 mt-4">
                    <a th:href="@{/products/{id}/edit(id=${product.id})}" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600">Edit</a>
                    <a th:href="@{/products}" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Kembali ke Daftar</a>
                </div>
            </div>
        </div>
    </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
