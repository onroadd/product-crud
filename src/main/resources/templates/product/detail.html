<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main>
    <div class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex justify-center">
            <div class="w-full max-w-2xl">
                <h2 th:text="${product.name}" class="mb-6 text-2xl font-bold text-gray-800">Nama Produk</h2>

                <div class="bg-white shadow rounded-lg overflow-hidden">
                    <div class="p-6">
                        <table class="w-full">
                            <tr class="border-b border-gray-200">
                                <th class="text-gray-600 py-3 text-left w-1/3">Nama</th>
                                <td class="py-3" th:text="${product.name}">-</td>
                            </tr>
                            <tr class="border-b border-gray-200">
                                <th class="text-gray-600 py-3 text-left">Kategori</th>
                                <td class="py-3" th:text="${product.category?.name}">-</td>
                            </tr>
                            <tr class="border-b border-gray-200">
                                <th class="text-gray-600 py-3 text-left">Harga</th>
                                <td class="py-3 font-semibold" th:text="${'Rp ' + #numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA')}">Rp 0</td>
                            </tr>
                            <tr class="border-b border-gray-200">
                                <th class="text-gray-600 py-3 text-left">Stok</th>
                                <td class="py-3" th:text="${product.stock}">0</td>
                            </tr>
                            <tr class="border-b border-gray-200">
                                <th class="text-gray-600 py-3 text-left">Deskripsi</th>
                                <td class="py-3" th:text="${product.description}">-</td>
                            </tr>
                            <tr class="border-b border-gray-200">
                                <th class="text-gray-600 py-3 text-left">Status</th>
                                <td class="py-3">
                                    <span th:if="${product.active}" class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-medium">Aktif</span>
                                    <span th:unless="${product.active}" class="bg-red-100 text-red-800 px-3 py-1 rounded-full text-sm font-medium">Tidak Aktif</span>
                                </td>
                            </tr>
                            <tr class="border-b border-gray-200">
                                <th class="text-gray-600 py-3 text-left">Tanggal Dibuat</th>
                                <td class="py-3" th:text="${product.createdAt}">-</td>
                            </tr>
                        </table>
                    </div>
                </div>

                <div class="flex gap-2 mt-6">
                    <a th:href="@{/products/{id}/edit(id=${product.id})}" class="bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-2 px-4 rounded transition-colors">
                        Edit
                    </a>
                    <a th:href="@{/products}" class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded transition-colors">
                        Kembali ke Daftar
                    </a>
                </div>
            </div>
        </div>
    </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
