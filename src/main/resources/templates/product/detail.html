<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body class="bg-gray-50 min-h-screen">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-6">
            <a th:href="@{/products}" class="inline-flex items-center gap-1 text-sm text-gray-600 hover:text-blue-600 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 17l-5-5m0 0l5-5m-5 5h12"/>
                </svg>
                Kembali ke Daftar
            </a>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="bg-gradient-to-r from-blue-600 to-blue-700 px-6 py-4">
                <h1 class="text-xl font-bold text-white" th:text="${product.name}">Nama Produk</h1>
                <p class="text-blue-100 text-sm mt-1" th:text="${product.category?.name}">Kategori</p>
            </div>

            <div class="p-6">
                <!-- Product Info -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div class="space-y-4">
                        <div>
                            <p class="text-sm text-gray-500 font-medium">Harga</p>
                            <p class="text-2xl font-bold text-gray-800 mt-1" th:text="${'Rp ' + #numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA')}">Rp 0</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 font-medium">Stok</p>
                            <p class="text-lg font-semibold text-gray-800 mt-1" th:text="${product.stock}">0</p>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <p class="text-sm text-gray-500 font-medium">Status</p>
                            <span th:class="${product.active} ? 'inline-block mt-1 px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800' : 'inline-block mt-1 px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-800'" 
                                  th:text="${product.active} ? 'Aktif' : 'Tidak Aktif'">Status</span>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 font-medium">Tanggal Dibuat</p>
                            <p class="text-sm text-gray-800 mt-1" th:text="${product.createdAt}">-</p>
                        </div>
                    </div>
                </div>

                <!-- Description -->
                <div class="border-t border-gray-100 pt-6" th:if="${product.description}">
                    <p class="text-sm text-gray-500 font-medium mb-2">Deskripsi</p>
                    <p class="text-gray-700 leading-relaxed" th:text="${product.description}">-</p>
                </div>

                <!-- Created/Updated Info -->
                <div class="border-t border-gray-100 mt-6 pt-4 flex flex-col sm:flex-row justify-between gap-2 text-sm text-gray-500">
                    <p th:if="${product.createdBy}">Dibuat oleh: <span class="font-medium" th:text="${product.createdBy}">-</span></p>
                    <p th:if="${product.updatedBy}">Diperbarui oleh: <span class="font-medium" th:text="${product.updatedBy}">-</span></p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="bg-gray-50 px-6 py-4 flex items-center justify-end gap-3 border-t border-gray-100">
                <a th:href="@{/products}" class="px-6 py-2.5 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition-colors">
                    Kembali
                </a>
                <a th:href="@{/products/{id}/edit(id=${product.id})}" class="inline-flex items-center gap-2 bg-yellow-500 hover:bg-yellow-600 text-white font-medium px-6 py-2.5 rounded-lg transition-colors shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.586a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                    </svg>
                    Edit
                </a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
