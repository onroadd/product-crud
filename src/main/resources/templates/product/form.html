<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main>
    <div class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex justify-center">
            <div class="w-full max-w-2xl">
                <h2 th:text="${product.id != null} ? 'Edit Produk' : 'Tambah Produk Baru'" class="mb-6 text-2xl font-bold text-gray-800">Form Produk</h2>

                <form th:action="@{/products/save}" th:object="${product}" method="post">

                    <!-- Hidden ID field -->
                    <input type="hidden" th:field="*{id}">

                     <!-- Nama Produk -->
                     <div class="mb-3">
                         <label for="name" class="block mb-2">Nama Produk</label>
                         <input type="text" class="w-full border border-gray-300 rounded px-3 py-2" id="name" th:field="*{name}"
                                placeholder="Masukkan nama produk" required>
                     </div>

                     <!-- Kategori -->
                     <div class="mb-3">
                         <label for="category" class="block mb-2">Kategori</label>
                         <select class="w-full border border-gray-300 rounded px-3 py-2" id="category" th:field="*{category}" required>
                             <option value="">-- Pilih Kategori --</option>
                             <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.displayName}">Kategori</option>
                         </select>
                     </div>

                     <!-- Harga -->
                     <div class="mb-3">
                         <label for="priceDisplay" class="block mb-2">Harga</label>
                         <input type="hidden" th:field="*{price}">
                         <input type="text" class="w-full border border-gray-300 rounded px-3 py-2" id="priceDisplay"
                                placeholder="Masukkan harga produk" required>
                     </div>

                     <!-- Stok -->
                     <div class="mb-3">
                         <label for="stock" class="block mb-2">Stok</label>
                         <input type="number" class="w-full border border-gray-300 rounded px-3 py-2" id="stock" th:field="*{stock}"
                                min="0" placeholder="Masukkan jumlah stok" required>
                     </div>

                     <!-- Deskripsi -->
                     <div class="mb-3">
                         <label for="description" class="block mb-2">Deskripsi</label>
                         <textarea class="w-full border border-gray-300 rounded px-3 py-2" id="description" th:field="*{description}"
                                   rows="3" placeholder="Masukkan deskripsi produk"></textarea>
                     </div>

                     <!-- Produk Aktif -->
                     <div class="mb-3 flex items-center">
                         <input type="checkbox" class="mr-2" id="active" th:field="*{active}">
                         <label for="active">Produk Aktif</label>
                     </div>

                     <!-- Tanggal Dibuat -->
                     <div class="mb-3">
                         <label for="createdAt" class="block mb-2">Tanggal Dibuat</label>
                         <input type="date" class="w-full border border-gray-300 rounded px-3 py-2" id="createdAt" th:field="*{createdAt}" required>
                     </div>

                     <!-- Buttons -->
                     <div class="flex gap-2">
                         <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Simpan Produk</button>
                         <a th:href="@{/products}" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Batal</a>
                     </div>

                </form>
            </div>
        </div>
    </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
