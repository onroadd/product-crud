<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body class="bg-gray-50 min-h-screen">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="max-w-3xl mx-auto px-4 py-8">
        <div class="mb-6">
            <a th:href="@{/products}" class="inline-flex items-center gap-1 text-sm text-gray-600 hover:text-blue-600 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 17l-5-5m0 0l5-5m-5 5h12"/>
                </svg>
                Kembali ke Daftar
            </a>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="bg-gradient-to-r from-blue-600 to-blue-700 px-6 py-4">
                <h1 class="text-xl font-bold text-white" th:text="${product.id != null} ? 'Edit Produk' : 'Tambah Produk Baru'">Form Produk</h1>
                <p class="text-blue-100 text-sm mt-1" th:text="${product.id != null} ? 'Ubah informasi produk' : 'Lengkapi data produk baru'">Deskripsi</p>
            </div>

            <!-- Alert Messages -->
            <div th:if="${errorMessage}" class="mx-6 mt-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg">
                <div class="flex items-center">
                    <svg class="w-5 h-5 text-red-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <p class="text-red-700" th:text="${errorMessage}"></p>
                </div>
            </div>

            <form th:action="@{/products/save}" th:object="${product}" method="post" class="p-6 space-y-6">
                <input type="hidden" th:field="*{id}">

                <!-- Nama Produk -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Nama Produk</label>
                    <input type="text" id="name" th:field="*{name}" required
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                           placeholder="Masukkan nama produk">
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-500 text-sm mt-1"></p>
                </div>

                <!-- Kategori -->
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-700 mb-2">Kategori</label>
                    <select id="category" th:field="*{category.id}" required
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white">
                        <option value="">Pilih Kategori</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Kategori</option>
                    </select>
                    <p th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="text-red-500 text-sm mt-1"></p>
                </div>

                <!-- Harga & Stok -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="priceDisplay" class="block text-sm font-medium text-gray-700 mb-2">Harga (Rp)</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500">Rp</span>
                            <input type="text" id="priceDisplay" required
                                   class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                                   placeholder="0">
                            <input type="hidden" th:field="*{price}" id="price">
                        </div>
                        <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-red-500 text-sm mt-1"></p>
                    </div>

                    <div>
                        <label for="stock" class="block text-sm font-medium text-gray-700 mb-2">Stok</label>
                        <input type="number" id="stock" th:field="*{stock}" required min="0"
                               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                               placeholder="0">
                        <p th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}" class="text-red-500 text-sm mt-1"></p>
                    </div>
                </div>

                <!-- Deskripsi -->
                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Deskripsi</label>
                    <textarea id="description" th:field="*{description}" rows="4"
                              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none"
                              placeholder="Masukkan deskripsi produk (opsional)"></textarea>
                </div>

                <!-- Status Aktif -->
                <div class="flex items-center gap-3 p-4 bg-gray-50 rounded-lg">
                    <input type="checkbox" id="active" th:field="*{active}" 
                           class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                    <label for="active" class="text-sm font-medium text-gray-700">Produk Aktif</label>
                </div>

                <!-- Buttons -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
                    <a th:href="@{/products}" class="px-6 py-2.5 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition-colors">
                        Batal
                    </a>
                    <button type="submit" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg transition-colors shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        Simpan
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
        const priceHidden = document.getElementById('price');
        const priceDisplay = document.getElementById('priceDisplay');

        function formatThousand(value) {
            return Number(value).toLocaleString('id-ID');
        }

        // Init: format existing value
        if (priceHidden.value && priceHidden.value !== '0') {
            priceDisplay.value = formatThousand(priceHidden.value);
        }

        // On input: format display, sync raw value to hidden, preserve cursor
        priceDisplay.addEventListener('input', function () {
            const oldValue = this.value;
            const cursorPos = this.selectionStart;
            const dotsBeforeCursor = oldValue.substring(0, cursorPos).split('.').length - 1;

            const raw = oldValue.replace(/\./g, '').replace(/\D/g, '');
            priceHidden.value = raw;
            const formatted = raw ? formatThousand(raw) : '';
            this.value = formatted;

            const digitPos = cursorPos - dotsBeforeCursor;
            const newDotsBeforeCursor = formatted.substring(0, digitPos + dotsBeforeCursor + 1).split('.').length - 1;
            this.setSelectionRange(digitPos + newDotsBeforeCursor, digitPos + newDotsBeforeCursor);
        });
    </script>
</body>
</html>
