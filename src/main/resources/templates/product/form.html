<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex justify-center">
            <div class="w-full max-w-2xl">
                <h2 th:text="${product.id != null} ? 'Edit Produk' : 'Tambah Produk Baru'" class="mb-6 text-2xl font-bold text-gray-800">Form Produk</h2>

                <form th:action="@{/products/save}" th:object="${product}" method="post">

                    <!-- Hidden ID field -->
                    <input type="hidden" th:field="*{id}">

                     <!-- Nama Produk -->
                     <div class="mb-3">
                         <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Nama Produk</label>
                         <input type="text" class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" 
                                id="name" th:field="*{name}"
                                placeholder="Masukkan nama produk" required>
                     </div>

                     <!-- Kategori -->
                     <div class="mb-3">
                         <label for="category" class="block text-sm font-medium text-gray-700 mb-2">Kategori</label>
                         <select class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" 
                                 id="category" th:field="*{category.id}" required>
                             <option value="">-- Pilih Kategori --</option>
                             <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Kategori</option>
                         </select>
                     </div>

                     <!-- Harga -->
                     <div class="mb-3">
                         <label for="priceDisplay" class="block text-sm font-medium text-gray-700 mb-2">Harga</label>
                         <input type="hidden" th:field="*{price}">
                         <input type="text" class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" 
                                id="priceDisplay"
                                placeholder="Masukkan harga produk" required>
                     </div>

                     <!-- Stok -->
                     <div class="mb-3">
                         <label for="stock" class="block text-sm font-medium text-gray-700 mb-2">Stok</label>
                         <input type="number" class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" 
                                id="stock" th:field="*{stock}"
                                min="0" placeholder="Masukkan jumlah stok" required>
                     </div>

                     <!-- Deskripsi -->
                     <div class="mb-3">
                         <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Deskripsi</label>
                         <textarea class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" 
                                   id="description" th:field="*{description}"
                                   rows="3" placeholder="Masukkan deskripsi produk"></textarea>
                     </div>

                     <!-- Produk Aktif -->
                     <div class="mb-3 flex items-center">
                         <input type="checkbox" class="mr-2" id="active" th:field="*{active}">
                         <label for="active" class="text-gray-700">Produk Aktif</label>
                     </div>

                     <!-- Tanggal Dibuat -->
                     <div class="mb-3">
                         <label for="createdAt" class="block text-sm font-medium text-gray-700 mb-2">Tanggal Dibuat</label>
                         <input type="date" class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" 
                                id="createdAt" th:field="*{createdAt}" required>
                     </div>

                     <!-- Buttons -->
                     <div class="flex gap-2">
                         <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                             Simpan Produk
                         </button>
                         <a th:href="@{/products}" class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors">
                             Batal
                         </a>
                     </div>

                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
        const priceHidden = document.getElementById('price');
        const priceDisplay = document.getElementById('priceDisplay');

        function formatThousand(value) {
            return Number(value).toLocaleString('id-ID');
        }

        // Init: format existing value
        if (priceHidden.value && priceHidden.value !== '0') {
            priceDisplay.value = formatThousand(priceHidden.value);
        }

        // On input: format display, sync raw value to hidden, preserve cursor
        priceDisplay.addEventListener('input', function () {
            const oldValue = this.value;
            const cursorPos = this.selectionStart;
            const dotsBeforeCursor = oldValue.substring(0, cursorPos).split('.').length - 1;

            const raw = oldValue.replace(/\./g, '').replace(/\D/g, '');
            priceHidden.value = raw;
            const formatted = raw ? formatThousand(raw) : '';
            this.value = formatted;

            const digitPos = cursorPos - dotsBeforeCursor;
            const newDotsBeforeCursor = formatted.substring(0, digitPos + dotsBeforeCursor + 1).split('.').length - 1;
            this.setSelectionRange(digitPos + newDotsBeforeCursor, digitPos + newDotsBeforeCursor);
        });
    </script>
</body>
</html>
