<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle ?: 'Product CRUD'}">Product CRUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav th:fragment="navbar" class="bg-gray-800 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <a th:href="@{/dashboard}" class="text-xl font-bold text-white hover:text-gray-200">ProductCRUD</a>
                
                 <div class="hidden md:flex items-center space-x-1 border border-white/20 rounded-lg p-1">
                 <a th:href="@{/dashboard}" 
                    class="px-4 py-1.5 rounded-md text-sm font-medium transition-colors"
                    th:classappend="${#httpServletRequest.requestURI == '/dashboard'} ? 'bg-white text-gray-900' : 'text-gray-300 hover:bg-white/10'">
                     Dashboard
                 </a>
                 <a th:href="@{/products(catalog=true)}" 
                    class="px-4 py-1.5 rounded-md text-sm font-medium transition-colors"
                    th:classappend="${param.catalog != null and param.catalog[0] == 'true'} ? 'bg-white text-gray-900' : 'text-gray-300 hover:bg-white/10'">
                     Katalog
                 </a>
                 <!-- Produk Saya (CRUD) -->
                 <a th:href="@{/products}" 
                    class="px-4 py-1.5 rounded-md text-sm font-medium transition-colors"
                    th:classappend="${param.catalog == null or param.catalog[0] == 'false'} ? 'bg-white text-gray-900' : 'text-gray-300 hover:bg-white/10'">
                     Produk Saya
                 </a>
                     <div class="w-px h-6 bg-white/20 mx-1"></div>
                    <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="text-gray-300 hover:text-white text-sm font-medium px-2 transition-colors">
                            Logout
                        </button>
                    </form>
                </div>

                <button id="mobileMenuButton" class="md:hidden text-gray-700 focus:outline-none">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>

        <div id="mobileMenu" class="md:hidden hidden border-t border-gray-700">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a th:href="@{/products(catalog=true)}" class="block px-3 py-2 rounded-md text-base text-gray-300 hover:bg-gray-700 hover:text-white">Katalog</a>
                <a th:href="@{/products}" class="block px-3 py-2 rounded-md text-base text-gray-300 hover:bg-gray-700 hover:text-white">Produk Saya</a>
                <form th:action="@{/logout}" method="post" class="px-3 py-2">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="text-red-400 w-full text-left">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <footer th:fragment="footer" class="bg-gray-800 text-white mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <p class="text-center text-gray-400 text-sm">© 2026 ProductCRUD. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
