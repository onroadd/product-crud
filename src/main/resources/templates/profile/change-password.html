<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in-up">
        <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
            <!-- Form Header -->
            <div class="bg-gradient-to-r from-blue-600 via-blue-700 to-indigo-700 px-8 py-6 relative overflow-hidden">
                <div class="absolute inset-0 bg-black/10"></div>
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
                <div class="absolute -left-10 -bottom-10 w-24 h-24 bg-white/5 rounded-full blur-xl"></div>

                <div class="relative z-10">
                    <h1 class="text-2xl font-bold text-white mb-1">Change Password</h1>
                    <p class="text-blue-100 text-sm">Ubah kata sandi akun Anda</p>
                </div>
            </div>

            <!-- Form Body -->
            <div class="p-8">
                <form th:action="@{/profile/change-password}" method="post" class="space-y-5">
                    <!-- Alert Messages -->
                    <div th:if="${errorMessage}" class="p-4 bg-gradient-to-r from-red-50 to-rose-50 border-l-4 border-red-500 rounded-xl flex items-center gap-3 shadow-sm">
                        <div class="p-1 bg-red-500 rounded-full">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <p class="text-red-700 font-medium" th:text="${errorMessage}"></p>
                    </div>

                    <div th:if="${successMessage}" class="p-4 bg-gradient-to-r from-green-50 to-emerald-50 border-l-4 border-green-500 rounded-xl flex items-center gap-3 shadow-sm">
                        <div class="p-1 bg-green-500 rounded-full">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <p class="text-green-700 font-medium" th:text="${successMessage}"></p>
                    </div>

                    <!-- Hidden CSRF Token -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <!-- Old Password -->
                    <div class="group">
                        <label for="oldPassword" class="block text-sm font-bold text-gray-700 mb-2">Password Lama</label>
                        <input type="password" id="oldPassword" name="oldPassword" required
                               class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-300 hover:border-gray-300 bg-gray-50/50 focus:bg-white"
                               placeholder="Masukkan password lama">
                    </div>

                    <!-- New Password -->
                    <div class="group">
                        <label for="newPassword" class="block text-sm font-bold text-gray-700 mb-2">Password Baru</label>
                        <input type="password" id="newPassword" name="newPassword" required
                               class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-300 hover:border-gray-300 bg-gray-50/50 focus:bg-white"
                               placeholder="Masukkan password baru (minimal 6 karakter)">
                    </div>

                    <!-- Confirm New Password -->
                    <div class="group">
                        <label for="confirmNewPassword" class="block text-sm font-bold text-gray-700 mb-2">Konfirmasi Password Baru</label>
                        <input type="password" id="confirmNewPassword" name="confirmNewPassword" required
                               class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-300 hover:border-gray-300 bg-gray-50/50 focus:bg-white"
                               placeholder="Masukkan ulang password baru">
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex items-center justify-end gap-4 pt-6 border-t border-gray-100">
                        <a th:href="@{/profile}"
                           class="px-6 py-3 border border-gray-300 text-gray-700 font-semibold rounded-xl hover:bg-gray-50 hover:border-gray-400 transition-all duration-300">
                            Cancel
                        </a>
                        <button type="submit"
                                class="group inline-flex items-center gap-2 bg-gradient-to-br from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3 px-8 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-0.5 ring-2 ring-blue-400/20 hover:ring-blue-400/40">
                            <svg class="w-5 h-5 group-hover:rotate-90 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.586a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                            </svg>
                            Change Password
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
