<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in-up">
        <!-- Profile Card -->
        <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
            <!-- Profile Header with gradient background -->
            <div class="bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-700 px-8 py-12 text-center relative overflow-hidden">
                <div class="absolute inset-0 opacity-10">
                    <div class="absolute inset-0" style='background-image: url("data:image/svg+xml,%3Csvg width=\"60\" height=\"60\" viewBox=\"0 0 60 60\" xmlns=\"http://www.w3.org/2000/svg\"%3E%3Cg fill=\"none\" fill-rule=\"evenodd\"%3E%3Cg fill=\"%23ffffff\" fill-opacity=\"0.4\"%3E%3Cpath d=\"M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\"/%3E%3C/g%3E%3C/svg%3E");'></div>
                </div>

                <!-- Profile Image -->
                <div class="relative z-10 justify-center flex flex-col items-center">
                    <div class="relative group cursor-pointer">
                        <div class="absolute -inset-1 bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 rounded-full opacity-75 group-hover:opacity-100 blur transition duration-1000 group-hover:duration-200"></div>
                        <div class="relative w-32 h-32 rounded-full overflow-hidden border-4 border-white/30 shadow-2xl group-hover:scale-105 transition-transform duration-300">
                            <img th:src="${user.profileImageUrl != null and !user.profileImageUrl.isEmpty() ? user.profileImageUrl : 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjM1IiByPSIyNSIgZmlsbD0iYmxhY2siLz48cGF0aCBkPSJNMjUgMTAwIFE1MCA0MCA3NSAxMDAiIHN0cm9rZT0iYmxhY2siIHN0cm9rZS13aWR0aD0iMTUiIGZpbGw9Im5vbmUiLz48L3N2Zz4='}"
                                 alt="Profile"
                                 class="w-full h-full object-cover">
                        </div>
                        <div class="absolute bottom-1 right-1 h-5 w-5 bg-green-500 rounded-full border-4 border-white shadow-lg"></div>
                    </div>

                    <!-- User Info -->
                    <div class="mt-6 text-center">
                        <h2 class="text-3xl font-bold text-white mb-1" th:text="${user.fullName}">Full Name</h2>
                        <p class="text-blue-100 font-medium" th:text="${user.username}">username</p>
                        <p class="text-blue-200 text-sm mt-2 flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                            <span th:text="${user.email}">user@example.com</span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Profile Details -->
            <div class="p-8">
                <!-- Info Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
                    <div class="group p-5 bg-gradient-to-br from-gray-50 to-blue-50/30 rounded-xl border border-gray-100 hover:border-blue-200 hover:shadow-md transition-all duration-300">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="p-2 bg-blue-100 rounded-lg group-hover:bg-blue-200 transition-colors">
                                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                                </svg>
                            </div>
                            <p class="text-sm font-bold text-gray-500">Phone Number</p>
                        </div>
                        <p class="text-lg font-semibold text-gray-800" th:text="${user.phoneNumber ?: 'Not provided'}">+1234567890</p>
                    </div>

                    <div class="group p-5 bg-gradient-to-br from-gray-50 to-blue-50/30 rounded-xl border border-gray-100 hover:border-blue-200 hover:shadow-md transition-all duration-300">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="p-2 bg-blue-100 rounded-lg group-hover:bg-blue-200 transition-colors">
                                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                                </svg>
                            </div>
                            <p class="text-sm font-bold text-gray-500">Address</p>
                        </div>
                        <p class="text-lg font-semibold text-gray-800" th:text="${user.address ?: 'Not provided'}">123 Street, City, Country</p>
                    </div>

                    <div class="group p-5 bg-gradient-to-br from-gray-50 to-blue-50/30 rounded-xl border border-gray-100 hover:border-blue-200 hover:shadow-md transition-all duration-300 md:col-span-2">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="p-2 bg-blue-100 rounded-lg group-hover:bg-blue-200 transition-colors">
                                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
                                </svg>
                            </div>
                            <p class="text-sm font-bold text-gray-500">Bio</p>
                        </div>
                        <p class="text-lg font-semibold text-gray-800" th:text="${user.bio ?: 'Not provided'}">A short bio about the user.</p>
                    </div>

                    <div class="group p-5 bg-gradient-to-br from-gray-50 to-blue-50/30 rounded-xl border border-gray-100 hover:border-blue-200 hover:shadow-md transition-all duration-300">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="p-2 bg-blue-100 rounded-lg group-hover:bg-blue-200 transition-colors">
                                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2-2H5a2 2 0 00-2-2v12a2 2 0 002 2z"/>
                                </svg>
                            </div>
                            <p class="text-sm font-bold text-gray-500">Member Since</p>
                        </div>
                        <p class="text-lg font-semibold text-gray-800" th:text="${#temporals.format(user.createdAt, 'MMM dd, yyyy')}">Jan 01, 2023</p>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row justify-center gap-4 pt-4 border-t border-gray-100">
                    <a th:href="@{/profile/edit}"
                       class="group inline-flex items-center justify-center gap-2 bg-gradient-to-br from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 ring-2 ring-blue-400/30 hover:ring-blue-400/50">
                        <svg class="w-5 h-5 group-hover:rotate-12 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.586a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                        </svg>
                        Edit Profile
                    </a>
                    <a th:href="@{/profile/change-password}"
                       class="group inline-flex items-center justify-center gap-2 bg-gradient-to-br from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 ring-2 ring-amber-400/30 hover:ring-amber-400/50">
                        <svg class="w-5 h-5 group-hover:rotate-12 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                        Change Password
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
