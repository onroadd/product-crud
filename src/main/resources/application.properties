spring.application.name=product-crud

# ===== Konfigurasi Server =====
server.port=8080

# ===== Database Configuration - NeonDB Cloud PostgreSQL =====
# Using NeonDB pooler endpoint with SSL required
# Uncomment satu konfigurasi di bawah ini:

# Option A: With SSL validation (production-ready)
spring.datasource.url=jdbc:postgresql://${PGHOST}:5432/${PGDATABASE}?sslmode=require&ssl=true&tcpKeepAlive=true&connectTimeout=30&socketTimeout=60&prepareThreshold=0

# Option B: Skip SSL validation (development only - use if Option A error "Connection reset")
# spring.datasource.url=jdbc:postgresql://${PGHOST}:5432/${PGDATABASE}?sslmode=require&ssl=true&sslfactory=org.postgresql.ssl.NonValidatingFactory&tcpKeepAlive=true&connectTimeout=30&socketTimeout=60&prepareThreshold=0

spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== Debug: Logging (temporary) =====
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.postgresql=DEBUG

# ===== Optimasi HikariCP untuk NeonDB/Cloud =====
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=10000

# ===== Konfigurasi JPA/Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Konfigurasi Thymeleaf =====
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===== Konfigurasi Session =====
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
