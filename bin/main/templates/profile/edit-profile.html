<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in-up">
        <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
            <!-- Form Header -->
            <div class="bg-gradient-to-r from-blue-600 via-blue-700 to-indigo-700 px-8 py-6 relative overflow-hidden">
                <div class="absolute inset-0 bg-black/10"></div>
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
                <div class="absolute -left-10 -bottom-10 w-24 h-24 bg-white/5 rounded-full blur-xl"></div>

                <div class="relative z-10">
                    <h1 class="text-2xl font-bold text-white mb-1">Edit Profile</h1>
                    <p class="text-blue-100 text-sm">Perbarui informasi profil Anda</p>
                </div>
            </div>

            <!-- Form Body -->
            <div class="p-8">
                <!-- Form Fields -->
                <form th:action="@{/profile/edit}" method="post" enctype="multipart/form-data" class="space-y-5">
                    <!-- Alert Messages -->
                    <div th:if="${errorMessage}" class="mb-6 p-4 bg-gradient-to-r from-red-50 to-rose-50 border-l-4 border-red-500 rounded-xl flex items-center gap-3 shadow-sm">
                        <div class="p-1 bg-red-500 rounded-full">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <p class="text-red-700 font-medium" th:text="${errorMessage}"></p>
                    </div>

                    <div th:if="${successMessage}" class="mb-6 p-4 bg-gradient-to-r from-green-50 to-emerald-50 border-l-4 border-green-500 rounded-xl flex items-center gap-3 shadow-sm">
                        <div class="p-1 bg-green-500 rounded-full">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <p class="text-green-700 font-medium" th:text="${successMessage}"></p>
                    </div>

                    <!-- Profile Image Upload Section -->
                    <div class="mb-8 p-6 bg-gradient-to-br from-gray-50 to-blue-50/30 rounded-xl border border-gray-200">
                        <label class="block text-sm font-bold text-gray-700 mb-4">Profile Image</label>

                        <div class="flex items-center gap-8">
                            <!-- Current Image -->
                            <div th:if="${user.profileImageUrl != null and !user.profileImageUrl.isEmpty()}" class="flex-shrink-0">
                                <p class="text-sm font-semibold text-gray-600 mb-2">Gambar Saat Ini</p>
                                <img th:src="${user.profileImageUrl}"
                                     alt="Current Profile"
                                     class="h-24 w-24 rounded-full object-cover border-3 border-blue-200 shadow-lg">
                            </div>

                            <!-- Upload Area -->
                            <div class="flex-grow">
                                <input type="file"
                                       id="profileImage"
                                       name="profileImage"
                                       accept="image/*"
                                       onchange="previewImage(this, 'imagePreview')"
                                       class="block w-full text-sm text-gray-500 file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-gradient-to-br file:from-blue-50 file:to-indigo-50 file:text-blue-600 hover:file:bg-gradient-to-br hover:file:from-blue-100 hover:file:to-indigo-100 transition-all duration-300 cursor-pointer">

                                <p class="text-xs text-gray-500 mt-2 flex items-center gap-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                    Upload foto (max 2MB). Kosongkan untuk mempertahankan gambar saat ini.
                                </p>
                            </div>

                            <!-- Preview -->
                            <div th:if="${user.profileImageUrl == null or user.profileImageUrl.isEmpty()}" class="flex-shrink-0">
                                <p class="text-sm font-semibold text-gray-600 mb-2">Preview</p>
                                <img id="imagePreview"
                                     class="hidden h-24 w-24 rounded-full object-cover border-3 border-green-400 shadow-lg"
                                     alt="Preview">
                            </div>
                        </div>
                    </div>

                    <!-- Hidden Fields -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="id" th:value="${user.id}"/>

                    <!-- Full Name -->
                    <div class="group">
                        <label for="fullName" class="block text-sm font-bold text-gray-700 mb-2">Nama Lengkap</label>
                        <input type="text" id="fullName" name="fullName" th:value="${user.fullName}" required
                               class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-300 hover:border-gray-300 bg-gray-50/50 focus:bg-white">
                    </div>

                    <!-- Email -->
                    <div class="group">
                        <label for="email" class="block text-sm font-bold text-gray-700 mb-2">Email</label>
                        <input type="email" id="email" name="email" th:value="${user.email}"
                               class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-300 hover:border-gray-300 bg-gray-50/50 focus:bg-white">
                    </div>

                    <!-- Phone Number -->
                    <div class="group">
                        <label for="phoneNumber" class="block text-sm font-bold text-gray-700 mb-2">Phone Number</label>
                        <input type="tel" id="phoneNumber" name="phoneNumber" th:value="${user.phoneNumber}"
                               class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-300 hover:border-gray-300 bg-gray-50/50 focus:bg-white"
                               placeholder="+1234567890">
                    </div>

                    <!-- Address -->
                    <div class="group">
                        <label for="address" class="block text-sm font-bold text-gray-700 mb-2">Address</label>
                        <textarea id="address" name="address" rows="3" th:text="${user.address}"
                                  class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-300 hover:border-gray-300 bg-gray-50/50 focus:bg-white resize-none"
                                  placeholder="Enter your address"></textarea>
                    </div>

                    <!-- Bio -->
                    <div class="group">
                        <label for="bio" class="block text-sm font-bold text-gray-700 mb-2">Bio</label>
                        <textarea id="bio" name="bio" rows="4" th:text="${user.bio}"
                                  class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-300 hover:border-gray-300 bg-gray-50/50 focus:bg-white resize-none"
                                  placeholder="Tell us about yourself"></textarea>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex items-center justify-end gap-4 pt-6 border-t border-gray-100">
                        <a th:href="@{/profile}"
                           class="px-6 py-3 border border-gray-300 text-gray-700 font-semibold rounded-xl hover:bg-gray-50 hover:border-gray-400 transition-all duration-300">
                            Cancel
                        </a>
                        <button type="submit"
                                class="group inline-flex items-center gap-2 bg-gradient-to-br from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3 px-8 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-0.5 ring-2 ring-blue-400/20 hover:ring-blue-400/40">
                            <svg class="w-5 h-5 group-hover:rotate-90 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                            </svg>
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    
    <script>
        function previewImage(input, previewId) {
            const preview = document.getElementById(previewId);
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
