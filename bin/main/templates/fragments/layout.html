<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle ?: 'Product CRUD'}">Product CRUD</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const profileDropdown = document.getElementById('profileDropdown');
            const profileDropdownMenu = document.getElementById('profileDropdownMenu');
            const mobileMenuButton = document.getElementById('mobileMenuButton');
            const mobileMenu = document.getElementById('mobileMenu');
            
            if (profileDropdown && profileDropdownMenu) {
                profileDropdown.addEventListener('click', function(e) {
                    e.stopPropagation();
                    profileDropdownMenu.classList.toggle('hidden');
                });
                document.addEventListener('click', function() {
                    if (!profileDropdownMenu.classList.contains('hidden')) {
                        profileDropdownMenu.classList.add('hidden');
                    }
                });
            }
            
            if (mobileMenuButton && mobileMenu) {
                mobileMenuButton.addEventListener('click', function() {
                    mobileMenu.classList.toggle('hidden');
                });
                document.addEventListener('click', function(event) {
                    if (!mobileMenuButton.contains(event.target) && !mobileMenu.contains(event.target)) {
                        mobileMenu.classList.add('hidden');
                    }
                });
            }
        });
    </script>
</head>

<nav th:fragment="navbar" class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <!-- Logo -->
            <div class="flex-shrink-0 flex items-center">
                <a th:href="@{/dashboard}" class="text-xl font-bold">
                    <span class="text-blue-600">Product</span>CRUD
                </a>
            </div>

            <!-- Desktop Navigation -->
            <div class="hidden md:flex md:items-center md:space-x-1">
                <a th:href="@{/dashboard}" 
                   class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-all duration-200"
                   th:classappend="${#httpServletRequest.requestURI == '/dashboard'} ? 'bg-blue-50 text-blue-600' : ''">
                    Dashboard
                </a>
                <a th:href="@{/products(catalog=true)}" 
                   class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-all duration-200"
                   th:classappend="${param.catalog != null and param.catalog[0] == 'true'} ? 'bg-blue-50 text-blue-600' : ''">
                    Katalog
                </a>
                <a th:href="@{/products}" 
                   class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-all duration-200"
                   th:classappend="${param.catalog == null or param.catalog[0] == 'false'} ? 'bg-blue-50 text-blue-600' : ''">
                    Produk Saya
                </a>
            </div>

            <!-- Right Section: Profile -->
            <div class="hidden md:block">
                <div class="relative" sec:authorize="isAuthenticated()">
                    <button id="profileDropdown" 
                            class="flex items-center space-x-2 p-1.5 pr-3 rounded-lg hover:bg-gray-100 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
                        <img th:src="${#authentication.principal.getClass().getName() == 'com.example.productcrud.service.CustomUserDetails' and !#strings.isEmpty(#authentication.principal.user.profileImageUrl) ? #authentication.principal.user.profileImageUrl : 'https://via.placeholder.com/32'}"
                             alt="Profile"
                             class="h-8 w-8 rounded-full object-cover border-2 border-blue-500/30">
                        <span class="text-sm font-medium text-gray-700 max-w-[100px] truncate">
                            <span th:text="${#authentication.principal.getClass().getName() == 'com.example.productcrud.service.CustomUserDetails' ? #authentication.principal.user.fullName : 'User'}">Username</span>
                        </span>
                        <svg class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>
                    
                    <!-- Dropdown Menu -->
                    <div th:if="${#authentication.principal.getClass().getName() == 'com.example.productcrud.service.CustomUserDetails'}" 
                         id="profileDropdownMenu" 
                         class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl py-2 z-50 hidden origin-top-right border border-gray-200">
                        <!-- Header -->
                        <div class="px-4 py-2 border-b border-gray-100">
                            <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider">Akun Saya</p>
                        </div>
                        
                        <!-- Profile Link -->
                        <a th:href="@{/profile}" 
                           class="flex items-center px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">
                            <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                            My Profile
                        </a>
                        
                        <!-- Logout -->
                        <form th:action="@{/logout}" method="post" class="block">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" 
                                    class="flex items-center w-full px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors">
                                <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                                </svg>
                                Logout
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Mobile Menu Button -->
            <button id="mobileMenuButton" 
                    class="md:hidden p-2 rounded-lg hover:bg-gray-100 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500/50">
                <svg class="h-6 w-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="md:hidden hidden border-t border-gray-200 bg-white">
        <div class="px-4 pt-2 pb-4 space-y-1">
            <a th:href="@{/dashboard}" 
               class="flex items-center px-4 py-3 rounded-lg text-base font-medium text-gray-700 hover:bg-gray-50 transition-colors"
               th:classappend="${#httpServletRequest.requestURI == '/dashboard'} ? 'bg-blue-50 text-blue-600' : ''">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                Dashboard
            </a>
            <a th:href="@{/products(catalog=true)}" 
               class="flex items-center px-4 py-3 rounded-lg text-base font-medium text-gray-700 hover:bg-gray-50 transition-colors"
               th:classappend="${param.catalog != null and param.catalog[0] == 'true'} ? 'bg-blue-50 text-blue-600' : ''">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                </svg>
                Katalog
            </a>
            <a th:href="@{/products}" 
               class="flex items-center px-4 py-3 rounded-lg text-base font-medium text-gray-700 hover:bg-gray-50 transition-colors"
               th:classappend="${param.catalog == null or param.catalog[0] == 'false'} ? 'bg-blue-50 text-blue-600' : ''">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                </svg>
                Produk Saya
            </a>
            
            <!-- Mobile Profile Section -->
            <div sec:authorize="isAuthenticated()">
                <div class="border-t border-gray-200 my-2"></div>
                
                <!-- Profile Info -->
                <div class="flex items-center px-4 py-3" th:if="${#authentication.principal.getClass().getName() == 'com.example.productcrud.service.CustomUserDetails'}">
                    <img th:src="${#authentication.principal.getClass().getName() == 'com.example.productcrud.service.CustomUserDetails' and !#strings.isEmpty(#authentication.principal.user.profileImageUrl) ? #authentication.principal.user.profileImageUrl : 'https://via.placeholder.com/40'}"
                         alt="Profile"
                         class="h-10 w-10 rounded-full object-cover border-2 border-blue-500/30">
                    <div class="ml-3">
                        <p class="text-sm font-medium text-gray-800" th:text="${#authentication.principal.getClass().getName() == 'com.example.productcrud.service.CustomUserDetails' ? #authentication.principal.user.fullName : 'User'}">Username</p>
                        <p class="text-xs text-gray-500">Member</p>
                    </div>
                </div>
                
                <!-- Mobile Navigation Links -->
                <a th:href="@{/profile}" 
                   class="flex items-center px-4 py-3 rounded-lg text-base font-medium text-gray-700 hover:bg-gray-50 transition-colors"
                   th:if="${#authentication.principal.getClass().getName() == 'com.example.productcrud.service.CustomUserDetails'}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    My Profile
                </a>
                
                <!-- Mobile Logout -->
                <form th:action="@{/logout}" method="post" class="mt-2">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" 
                            class="flex items-center w-full px-4 py-3 rounded-lg text-base font-medium text-red-600 hover:bg-red-50 transition-colors">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        Logout
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="bg-white border-t border-gray-200 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="flex flex-col md:flex-row justify-between items-center gap-2">
            <p class="text-center text-gray-500 text-sm">© 2026 ProductCRUD. All rights reserved.</p>
            <div class="flex space-x-4 text-sm text-gray-500">
                <span>JPA Fundamentals Project</span>
            </div>
        </div>
    </div>
</footer>
